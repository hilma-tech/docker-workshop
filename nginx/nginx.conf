# Global configurations:
pid                  /run/nginx.pid;
worker_processes     auto;
worker_rlimit_nofile 1024;
include              /etc/nginx/modules-enabled/*.conf;

events {
    multi_accept       on; 
    worker_connections 1024; 
}

http {
    charset                utf-8; 
    sendfile               on; 
    tcp_nopush             on; 
    tcp_nodelay            on; 
    server_tokens          off; 
    log_not_found          off; 
    types_hash_max_size    2048;
    types_hash_bucket_size 64;
    client_max_body_size   16M; 
    
    # MIME
    include                mime.types; 
    default_type           application/octet-stream; 
    
    # Logging
    access_log             off; 
    error_log              /dev/null; 
    
    # Rate 
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=lim:10m rate=25r/s;

    server {
        listen 80; 
        server_name localhost; 
        include                 nginxconfig.io/security.conf;
        include                 nginxconfig.io/general.conf;
        
        # API routes - proxy to external service, 1min cache for GET with stale serving
        location ^~ /api/ {
            include                 nginxconfig.io/security.conf;
            limit_req zone=lim burst=20;
            proxy_pass http://server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
              
        # All other routes - proxy to React Router app on srr server pod
        location / {
            include                 nginxconfig.io/security.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            root                /usr/share/nginx/html;
            index               index.html;
            try_files           $uri $uri/ /index.html;  # SPA fallback for React Router
            add_header          Cache-Control "no-store" always;
        }
    }
}
